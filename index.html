<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Security Verification</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#08090d;
  --ink:#0e1016;
  --amber:#f5b942;--emerald:#34e2a1;--indigo:#6c7bff;--rose:#ff6b8a;
  --green:#2ee68a;--red:#ff4d5e;
  --text:#f7f8fb;--muted:#6b7080;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Inter',system-ui,sans-serif;
  color:var(--text);display:flex;align-items:center;justify-content:center;overflow:hidden;}

/* faint vignette */
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background:radial-gradient(circle at 50% 30%, rgba(108,123,255,.08), transparent 60%);
}

/* ── Animated gradient-border card (Linear/Vercel style) ──────────────── */
.border-wrap{
  position:relative;z-index:1;width:calc(100% - 36px);max-width:368px;
  border-radius:26px;padding:1.5px;
  background:conic-gradient(from var(--angle), var(--amber), var(--emerald), var(--indigo), var(--rose), var(--amber));
  animation:rotateBorder 5s linear infinite;
  box-shadow:0 30px 80px -25px rgba(0,0,0,.8);
}
@property --angle{syntax:'<angle>';initial-value:0deg;inherits:false;}
@keyframes rotateBorder{to{--angle:360deg;}}
.border-wrap.done{background:var(--green);animation:none;}
.border-wrap.fail{background:var(--red);animation:none;}

.card{
  background:linear-gradient(165deg, #12141d, #0a0b11);
  border-radius:24.5px;
  padding:38px 26px 0;text-align:center;overflow:hidden;position:relative;
  animation:rise .5s cubic-bezier(.16,1,.3,1);
}
@keyframes rise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
@keyframes shakeFail{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(3px);}}
.card.shake{animation:shakeFail .45s ease;}
.card.bounce{animation:cardBounce .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes cardBounce{0%{transform:scale(1);}50%{transform:scale(1.025);}100%{transform:scale(1);}}

/* ── Squircle icon container ──────────────────────────────────────── */
.squircle-zone{width:100%;height:118px;margin-bottom:22px;position:relative;display:flex;align-items:center;justify-content:center;}

.squircle{
  width:88px;height:88px;border-radius:26px;position:relative;
  background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.015));
  border:1px solid rgba(255,255,255,.09);
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.08), 0 16px 40px -16px rgba(0,0,0,.6);
  transition:transform .35s,border-color .35s;
}
.squircle.done{border-color:rgba(46,230,138,.5);transform:scale(1.08) rotate(0deg);}
.squircle.fail{border-color:rgba(255,77,94,.5);}
.squircle svg{width:38px;height:38px;}

@keyframes pulseGlow{0%,100%{opacity:.65;}50%{opacity:1;}}
#svgShield{animation:pulseGlow 1.6s ease-in-out infinite;}

@keyframes draw{from{stroke-dashoffset:48;}to{stroke-dashoffset:0;}}
#checkPath{stroke-dasharray:48;stroke-dashoffset:48;}
.squircle.done #checkPath{animation:draw .5s cubic-bezier(.4,0,.2,1) forwards .1s;}

@keyframes popX{0%{transform:scale(0) rotate(-40deg);opacity:0;}70%{transform:scale(1.25) rotate(6deg);}100%{transform:scale(1) rotate(0);opacity:1;}}
.squircle.fail svg{animation:popX .45s cubic-bezier(.34,1.56,.64,1);}

/* corner accent dots orbiting the squircle while scanning */
.orbit-dot{position:absolute;width:7px;height:7px;border-radius:50%;}
.orbit-dot.d1{background:var(--amber);top:0;left:50%;transform:translateX(-50%);animation:orbit1 2.4s linear infinite;}
.orbit-dot.d2{background:var(--emerald);top:50%;right:0;transform:translateY(-50%);animation:orbit2 2.4s linear infinite;}
.orbit-dot.d3{background:var(--indigo);bottom:0;left:50%;transform:translateX(-50%);animation:orbit3 2.4s linear infinite;}
@keyframes orbit1{0%,100%{opacity:.3;}50%{opacity:1;}}
@keyframes orbit2{0%,100%{opacity:1;}50%{opacity:.3;}}
@keyframes orbit3{0%,100%{opacity:.5;}50%{opacity:1;}}
.squircle-zone.resolved .orbit-dot{display:none;}

/* success burst rings */
.burst span{
  position:absolute;inset:0;margin:auto;width:88px;height:88px;border-radius:26px;
  border:2px solid var(--green);opacity:0;left:50%;top:50%;transform:translate(-50%,-50%) scale(1);
}
.burst.go span{animation:burstOut .9s ease-out forwards;}
.burst.go span:nth-child(2){animation-delay:.15s;}
.burst.go span:nth-child(3){animation-delay:.3s;}
@keyframes burstOut{0%{opacity:.8;transform:translate(-50%,-50%) scale(1);}100%{opacity:0;transform:translate(-50%,-50%) scale(1.9);}}

.confetti-dot{position:absolute;width:6px;height:6px;border-radius:50%;left:50%;top:50%;opacity:0;pointer-events:none;}
.confetti-dot.go{animation:flyOut .7s ease-out forwards;}
@keyframes flyOut{0%{opacity:1;transform:translate(-50%,-50%) scale(1);}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.3);}}

h2{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;margin-bottom:7px;}

.status-line{position:relative;height:20px;margin-bottom:24px;overflow:hidden;}
.status-line span{
  position:absolute;left:0;right:0;font-size:.83rem;color:var(--muted);font-weight:500;
  opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s;
}
.status-line span.show{opacity:1;transform:translateY(0);}

/* top-edge progress strip (full bleed, sits above content) */
.bar-track{height:3px;background:rgba(255,255,255,.06);margin:0 -26px 28px;position:relative;overflow:hidden;}
.bar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--amber),var(--emerald),var(--indigo));
  transition:width .4s cubic-bezier(.4,0,.2,1);}
.bar-fill.done{background:var(--green);width:100%!important;}
.bar-fill.fail{background:var(--red);width:100%!important;}

.pill{margin:0 0 18px;padding:12px 16px;border-radius:13px;font-size:.83rem;font-weight:700;line-height:1.4;
  display:none;animation:popX .4s cubic-bezier(.34,1.56,.64,1);}
.pill.ok{display:block;background:rgba(46,230,138,.1);color:var(--green);border:1px solid rgba(46,230,138,.3);}
.pill.err{display:block;background:rgba(255,77,94,.1);color:var(--red);border:1px solid rgba(255,77,94,.3);}

.footer{padding:0 0 22px;font-size:.63rem;color:var(--muted);line-height:1.5;opacity:.65;}
</style>
</head>
<body>

<div class="border-wrap" id="borderWrap">
  <div class="card" id="card">

    <div class="squircle-zone" id="squircleZone">
      <div class="orbit-dot d1"></div>
      <div class="orbit-dot d2"></div>
      <div class="orbit-dot d3"></div>
      <div class="burst" id="burst"><span></span><span></span><span></span></div>
      <div class="squircle" id="squircle">
        <svg id="svgShield" viewBox="0 0 24 24" fill="none" stroke="#f5b942" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <svg id="svgCheck" viewBox="0 0 24 24" fill="none" stroke="#2ee68a" stroke-width="2.6"
             stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <polyline id="checkPath" points="4 12 9.5 17.5 20 6"/>
        </svg>
        <svg id="svgX" viewBox="0 0 24 24" fill="none" stroke="#ff4d5e" stroke-width="2.6"
             stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>
        </svg>
      </div>
    </div>

    <h2 id="mainTitle">Verifying You</h2>
    <div class="status-line">
      <span class="show" id="st1">Checking your network…</span>
      <span id="st2">Scanning for VPN / proxy…</span>
      <span id="st3">Generating device signature…</span>
      <span id="st4">Finalizing with server…</span>
      <span id="stDoneOk">Checking your account…</span>
      <span id="stDoneFail">Please review and try again…</span>
    </div>

    <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
    <div class="pill" id="pill"></div>
    <p class="footer">Your data only prevents multi-accounting.<br>Never shared with third parties.</p>
  </div>
</div>

<script>
const BACKEND = "__BACKEND_URL__";
const p = new URLSearchParams(location.search);
const REF_ID = p.get("ref") || "0";
const MSG_ID = p.get("msg_id") || "0";

const tg = window.Telegram?.WebApp;
if(tg){ tg.ready(); tg.expand(); }
const initData = tg?.initData || "";

const bar=document.getElementById("bar");
const pill=document.getElementById("pill");
const card=document.getElementById("card");
const borderWrap=document.getElementById("borderWrap");
const squircle=document.getElementById("squircle");
const squircleZone=document.getElementById("squircleZone");
const burst=document.getElementById("burst");
const setBar=pct=>bar.style.width=pct+"%";

function setStatus(id){
  document.querySelectorAll(".status-line span").forEach(s=>s.classList.remove("show"));
  document.getElementById(id).classList.add("show");
}

function spawnConfetti(){
  const colors=["#f5b942","#34e2a1","#6c7bff","#ff6b8a","#2ee68a"];
  for(let i=0;i<12;i++){
    const dot=document.createElement("div");
    dot.className="confetti-dot";
    const angle=(Math.PI*2*i)/12 + Math.random()*0.3;
    const dist=65+Math.random()*35;
    dot.style.setProperty("--tx", `${Math.cos(angle)*dist}px`);
    dot.style.setProperty("--ty", `${Math.sin(angle)*dist}px`);
    dot.style.background=colors[i%colors.length];
    squircleZone.appendChild(dot);
    requestAnimationFrame(()=>dot.classList.add("go"));
    setTimeout(()=>dot.remove(),800);
  }
}

function showSuccess(){
  borderWrap.classList.add("done");
  bar.classList.add("done");
  squircle.classList.add("done");
  squircleZone.classList.add("resolved");
  card.classList.add("bounce");
  document.getElementById("svgShield").style.display="none";
  document.getElementById("svgCheck").style.display="";
  document.getElementById("mainTitle").textContent="Verified!";
  setStatus("stDoneOk");
  burst.classList.add("go");
  spawnConfetti();
  pill.className="pill ok"; pill.textContent="✅ All set — you're good to go!";
  tg?.HapticFeedback?.notificationOccurred("success");
}
function showFail(msg){
  borderWrap.classList.add("fail");
  bar.classList.add("fail");
  squircle.classList.add("fail");
  squircleZone.classList.add("resolved");
  card.classList.add("shake");
  document.getElementById("svgShield").style.display="none";
  document.getElementById("svgX").style.display="";
  document.getElementById("mainTitle").textContent="Access Denied";
  setStatus("stDoneFail");
  pill.className="pill err"; pill.textContent=msg;
  tg?.HapticFeedback?.notificationOccurred("error");
}
function closeApp(ms){ setTimeout(()=> tg?.close(), ms); }

async function getIP(){setBar(10);
  try{const r=await fetch("https://api.ipify.org?format=json",{signal:AbortSignal.timeout(4000)});
    const d=await r.json();setBar(25);return d.ip||"unknown";}
  catch{setBar(25);return "unknown";}}

async function checkVPN(ip){setStatus("st2");setBar(35);
  try{const r=await fetch(`https://proxycheck.io/v2/${ip}?vpn=1`,{signal:AbortSignal.timeout(3500)});
    const d=await r.json(),info=d[ip]||{},vpn=info.proxy==="yes"||info.vpn==="yes";
    setBar(50);return vpn;}
  catch{setBar(50);return false;}}

async function getFingerprint(){setStatus("st3");setBar(60);const parts=[];
  try{const c=document.createElement("canvas"),x=c.getContext("2d");x.textBaseline="top";x.font="14px Arial";
    x.fillStyle="#f60";x.fillRect(125,1,62,20);x.fillStyle="#069";x.fillText("verifyBot🔐",2,15);
    x.fillStyle="rgba(102,204,0,.7)";x.fillText("verifyBot🔐",4,17);parts.push(c.toDataURL());}catch{parts.push("nc");}
  try{const c2=document.createElement("canvas");const gl=c2.getContext("webgl")||c2.getContext("experimental-webgl");
    if(gl){const d=gl.getExtension("WEBGL_debug_renderer_info");
      parts.push(gl.getParameter(d?.UNMASKED_VENDOR_WEBGL||37445));parts.push(gl.getParameter(d?.UNMASKED_RENDERER_WEBGL||37446));}}catch{parts.push("nw");}
  parts.push(`${screen.width}x${screen.height}x${screen.colorDepth}`);parts.push(`dpr:${devicePixelRatio||1}`);
  parts.push(Intl.DateTimeFormat().resolvedOptions().timeZone);
  parts.push(navigator.hardwareConcurrency||0);parts.push(navigator.deviceMemory||0);
  parts.push(navigator.platform);parts.push(navigator.language);parts.push(navigator.userAgent);
  try{const AC=window.AudioContext||window.webkitAudioContext;const ac=new AC(),o=ac.createOscillator(),
      an=ac.createAnalyser(),g=ac.createGain();g.gain.value=0;o.connect(an);an.connect(g);g.connect(ac.destination);
      o.start(0);const buf=new Float32Array(an.frequencyBinCount);an.getFloatFrequencyData(buf);o.stop();ac.close();
      parts.push(buf.slice(0,8).join(","));}catch{parts.push("na");}
  const enc=new TextEncoder().encode(parts.join("|||"));
  const buf=await crypto.subtle.digest("SHA-256",enc);
  const fp=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  setBar(80);return fp;}

async function submit(ip,isVpn,fp){setStatus("st4");setBar(90);
  const res=await fetch(`${BACKEND}/api/verify`,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({initData,ip,ua:navigator.userAgent,fingerprint:fp,isVpn,refId:REF_ID,msgId:MSG_ID})});
  if(!res.ok) throw new Error(`HTTP ${res.status}`);return await res.json();}

(async()=>{
  try{
    const ip=await getIP();
    const isVpn=await checkVPN(ip);
    if(isVpn){setBar(100);showFail("🚫 VPN / Proxy is not allowed.");closeApp(2200);return;}
    const fp=await getFingerprint();
    const result=await submit(ip,isVpn,fp);
    setBar(100);
    if(result.status==="verified"||result.status==="already_verified"){
      showSuccess();closeApp(1500);
    }else if(result.status==="blocked"){
      showFail("🚫 Verification failed. You are not allowed.");closeApp(2200);
    }else{throw new Error("Unexpected response");}
  }catch(e){showFail(`❌ Error: ${e.message}`);console.error(e);}
})();
</script>
</body>
</html>
