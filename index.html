<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Security Check</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;background:#090d18;
  font-family:'Inter',system-ui,sans-serif;
  color:#dde4f0;
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 50% at 50% -10%,rgba(56,120,255,.12) 0%,transparent 70%);
}

/* Card */
.card{
  position:relative;z-index:1;
  width:calc(100% - 32px);max-width:350px;
  background:#0f1622;
  border:1px solid rgba(255,255,255,.07);
  border-radius:22px;
  padding:32px 20px 26px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);
}

/* Icon */
.icon-zone{
  width:72px;height:72px;margin:0 auto 20px;
  position:relative;display:flex;align-items:center;justify-content:center;
}
.icon-bg{
  position:absolute;inset:0;border-radius:50%;
  background:rgba(56,120,255,.1);
  border:1.5px solid rgba(56,120,255,.22);
  transition:background .4s,border-color .4s;
}
.icon-zone.state-ok .icon-bg{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3);}
.icon-zone.state-err .icon-bg{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);}
.icon-zone svg{width:28px;height:28px;position:relative;z-index:1;transition:opacity .2s;}

@keyframes rot{to{transform:rotate(360deg)}}
.spin-ring{
  position:absolute;inset:-7px;border-radius:50%;
  border:2px solid transparent;
  border-top-color:#3878ff;
  border-right-color:rgba(56,120,255,.2);
  animation:rot .9s linear infinite;
}
.icon-zone.state-ok .spin-ring,
.icon-zone.state-err .spin-ring{display:none;}

/* Text */
.title{font-size:1.1rem;font-weight:800;letter-spacing:-.025em;color:#eef2ff;margin-bottom:4px;}
.sub{font-size:.76rem;color:#4a5d7a;line-height:1.5;margin-bottom:22px;min-height:2.2em;}

/* Bar */
.bar-track{height:3px;background:rgba(255,255,255,.06);border-radius:99px;margin-bottom:18px;overflow:hidden;}
.bar-fill{
  height:100%;width:0%;border-radius:99px;
  background:linear-gradient(90deg,#1d4ed8,#3b82f6);
  transition:width .5s cubic-bezier(.4,0,.2,1);
}
.bar-fill.s-ok{background:linear-gradient(90deg,#15803d,#22c55e);width:100%!important;}
.bar-fill.s-err{background:linear-gradient(90deg,#991b1b,#ef4444);width:100%!important;}

/* Steps */
.steps{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;}
.step{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;
  background:rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.06);
  border-radius:12px;text-align:left;
  transition:border-color .3s,background .3s;
}
.step.active{border-color:rgba(56,120,255,.35);background:rgba(56,120,255,.05);}
.step.s-ok  {border-color:rgba(34,197,94,.25);background:rgba(34,197,94,.04);}
.step.s-err {border-color:rgba(239,68,68,.3); background:rgba(239,68,68,.04);}

.dot{
  width:22px;height:22px;flex-shrink:0;border-radius:50%;
  background:rgba(255,255,255,.07);
  display:flex;align-items:center;justify-content:center;
  font-size:.6rem;font-weight:700;color:#556070;
  transition:background .3s,color .3s;
}
.step.active .dot{background:#3878ff;color:#fff;}
.step.s-ok   .dot{background:#22c55e;color:#fff;}
.step.s-err  .dot{background:#ef4444;color:#fff;}

.step-body{flex:1;min-width:0;}
.step-name{font-size:.76rem;font-weight:600;color:#c0cfe8;}
.step-info{font-size:.67rem;color:#374458;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.step.active .step-info{color:#5a7090;}
.step.s-ok   .step-info{color:#166534;}
.step.s-err  .step-info{color:#7f1d1d;}

@keyframes sp{to{transform:rotate(360deg)}}
.sp{
  width:12px;height:12px;flex-shrink:0;border-radius:50%;
  border:2px solid rgba(56,120,255,.15);
  border-top-color:#3878ff;
  animation:sp .7s linear infinite;
  display:none;
}
.step.active .sp{display:block;}

/* Result pill */
.pill{
  display:none;padding:12px 14px;border-radius:11px;
  font-size:.78rem;font-weight:500;line-height:1.6;text-align:left;
}
.pill strong{font-weight:700;}
.pill.s-ok {display:block;background:rgba(34,197,94,.07);color:#4ade80;border:1px solid rgba(34,197,94,.18);}
.pill.s-err{display:block;background:rgba(239,68,68,.07);color:#f87171;border:1px solid rgba(239,68,68,.18);}

@keyframes pulse-ok{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.2)}50%{box-shadow:0 0 0 9px rgba(34,197,94,0)}}
.icon-zone.state-ok .icon-bg{animation:pulse-ok 2s ease infinite;}
</style>
</head>
<body>
<div class="card">

  <div class="icon-zone" id="iconZone">
    <div class="spin-ring"></div>
    <div class="icon-bg"></div>
    <svg id="iShield" viewBox="0 0 24 24" fill="none" stroke="#3878ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      <polyline points="9 12 11 14 15 10"/>
    </svg>
    <svg id="iCheck" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <circle cx="12" cy="12" r="10"/><polyline points="7 12 10.5 15.5 17 9"/>
    </svg>
    <svg id="iX" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <circle cx="12" cy="12" r="10"/>
      <line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
    </svg>
  </div>

  <div class="title" id="ttl">Security Check</div>
  <div class="sub"   id="sub">Verifying your identity…</div>

  <div class="bar-track"><div class="bar-fill" id="bar"></div></div>

  <div class="steps">
    <div class="step active" id="s1">
      <div class="dot" id="d1">1</div>
      <div class="step-body">
        <div class="step-name">Network</div>
        <div class="step-info" id="i1">Fetching IP…</div>
      </div>
      <div class="sp"></div>
    </div>
    <div class="step" id="s2">
      <div class="dot" id="d2">2</div>
      <div class="step-body">
        <div class="step-name">Device ID</div>
        <div class="step-info" id="i2">Waiting…</div>
      </div>
      <div class="sp"></div>
    </div>
    <div class="step" id="s3">
      <div class="dot" id="d3">3</div>
      <div class="step-body">
        <div class="step-name">Account Check</div>
        <div class="step-info" id="i3">Waiting…</div>
      </div>
      <div class="sp"></div>
    </div>
  </div>

  <div class="pill" id="pill"></div>
</div>

<script>
/* ── Config ───────────────────────────────────── */
const BACKEND = "__BACKEND_URL__";

const _p      = new URLSearchParams(location.search);
const UID     = parseInt(_p.get("uid")    || "0", 10);
const REF_ID  = parseInt(_p.get("ref")    || "0", 10);
const MSG_ID  = parseInt(_p.get("msg_id") || "0", 10);

const tg      = window.Telegram?.WebApp || null;
if(tg){ tg.ready(); tg.expand(); }
const initData = tg?.initData || "";

/* ── DOM ──────────────────────────────────────── */
const $bar      = document.getElementById("bar");
const $pill     = document.getElementById("pill");
const $iconZone = document.getElementById("iconZone");

/* ── Helpers ──────────────────────────────────── */
function setBar(p){ $bar.style.width = p + "%"; }

function activate(n){
  document.getElementById(`s${n}`).classList.add("active");
  document.getElementById(`i${n}`).textContent = "Running…";
}
function ok(n, info){
  const s = document.getElementById(`s${n}`);
  s.classList.remove("active"); s.classList.add("s-ok");
  document.getElementById(`d${n}`).textContent = "✓";
  document.getElementById(`i${n}`).textContent = info;
}
function err(n, info){
  const s = document.getElementById(`s${n}`);
  s.classList.remove("active"); s.classList.add("s-err");
  document.getElementById(`d${n}`).textContent = "✕";
  document.getElementById(`i${n}`).textContent = info;
}

function showOK(){
  $iconZone.classList.add("state-ok");
  document.getElementById("iShield").style.display = "none";
  document.getElementById("iCheck").style.display  = "";
  document.getElementById("ttl").textContent = "Verified!";
  document.getElementById("sub").textContent = "Welcome! Returning to bot…";
  $bar.classList.add("s-ok");
  $pill.className   = "pill s-ok";
  $pill.textContent = "✅ Verification complete. Closing…";
  tg?.HapticFeedback?.notificationOccurred("success");
}

function showErr(reason){
  $iconZone.classList.add("state-err");
  document.getElementById("iShield").style.display = "none";
  document.getElementById("iX").style.display      = "";
  $bar.classList.add("s-err");
  $pill.className = "pill s-err";

  if(reason === "multi"){
    document.getElementById("ttl").textContent = "Duplicate Account";
    document.getElementById("sub").textContent = "This device is already linked to another account.";
    $pill.innerHTML =
      "👤 You are joining with a <strong>secondary account</strong>.<br><br>" +
      "Please open your <strong>first (main) Telegram account</strong> and use the invite link from there.<br><br>" +
      "Only real referrals are accepted.";
  } else if(reason === "vpn"){
    document.getElementById("ttl").textContent = "VPN Detected";
    document.getElementById("sub").textContent = "Please disable your VPN and try again.";
    $pill.innerHTML =
      "🔒 A <strong>VPN or Proxy</strong> is active on your connection.<br><br>" +
      "Turn it off, then press the verify button in the bot again.";
  } else {
    document.getElementById("ttl").textContent = "Access Denied";
    document.getElementById("sub").textContent = "Unable to verify. Please try again.";
    $pill.innerHTML = "❌ " + (reason || "Verification failed. Tap verify in the bot to retry.");
  }

  tg?.HapticFeedback?.notificationOccurred("error");
}

function close(ms){ setTimeout(() => tg?.close(), ms); }

/* ── Fetch with timeout ───────────────────────── */
async function get(url, ms = 6000){
  const ctrl  = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try{
    const r = await fetch(url, { signal: ctrl.signal });
    clearTimeout(timer);
    return r;
  } catch(e){ clearTimeout(timer); throw e; }
}

async function post(url, body, ms = 12000){
  const ctrl  = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try{
    const r = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
      signal: ctrl.signal
    });
    clearTimeout(timer);
    return r;
  } catch(e){ clearTimeout(timer); throw e; }
}

/* ══════════════════════════════════════════════
   STEP 1 — Get IP (soft, never blocks)
══════════════════════════════════════════════ */
async function getIP(){
  activate(1); setBar(10);
  try{
    const r  = await get("https://api.ipify.org?format=json");
    const d  = await r.json();
    const ip = (d.ip || "").trim() || "unknown";
    ok(1, ip); setBar(30);
    return ip;
  } catch{
    ok(1, "Resolved"); setBar(30);
    return "unknown";
  }
}

/* ══════════════════════════════════════════════
   STEP 2 — Device Fingerprint
   Collects as many stable signals as possible.
   The backend decides if it's a duplicate.
══════════════════════════════════════════════ */
async function getFingerprint(){
  activate(2); setBar(40);
  const P = [];

  /* Canvas 2D */
  try{
    const c   = document.createElement("canvas");
    c.width   = 240; c.height = 60;
    const ctx = c.getContext("2d");
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle    = "#f0f";
    ctx.fillRect(0, 0, 240, 60);
    ctx.fillStyle = "rgba(102,204,0,.7)";
    ctx.font      = "15px 'Arial'";
    ctx.fillText("Squad4xx🔐verify", 4, 20);
    ctx.fillStyle    = "#0cf";
    ctx.font         = "bold 13px 'Times New Roman'";
    ctx.fillText("fingerprint_2025", 10, 45);
    P.push("cv:" + c.toDataURL().slice(-80));
  } catch{ P.push("cv:x"); }

  /* WebGL renderer */
  try{
    const cv = document.createElement("canvas");
    const gl = cv.getContext("webgl") || cv.getContext("experimental-webgl");
    if(gl){
      const ext = gl.getExtension("WEBGL_debug_renderer_info");
      P.push("gl_v:" + gl.getParameter(ext?.UNMASKED_VENDOR_WEBGL   || 37445));
      P.push("gl_r:" + gl.getParameter(ext?.UNMASKED_RENDERER_WEBGL || 37446));
      /* WebGL precision fingerprint */
      const vs = gl.getShaderPrecisionFormat(gl.VERTEX_SHADER,   gl.HIGH_FLOAT);
      const fs = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT);
      P.push("gl_p:" + vs?.precision + "," + fs?.precision);
    } else P.push("gl:x");
  } catch{ P.push("gl:x"); }

  /* Screen */
  P.push("sc:" + screen.width + "x" + screen.height + "x" + screen.colorDepth);
  P.push("dpr:" + (devicePixelRatio || 1));
  P.push("tz:" + (Intl.DateTimeFormat().resolvedOptions().timeZone || ""));

  /* Hardware */
  P.push("cpu:" + (navigator.hardwareConcurrency || 0));
  P.push("mem:" + (navigator.deviceMemory        || 0));
  P.push("plat:" + (navigator.platform           || ""));
  P.push("lang:" + (navigator.language           || ""));
  P.push("langs:" + (navigator.languages || []).join(","));

  /* Touch / input */
  P.push("touch:" + navigator.maxTouchPoints);

  /* User agent */
  P.push("ua:" + navigator.userAgent);

  /* Font detection — test a few fonts */
  try{
    const base  = "monospace";
    const test  = ["Arial","Helvetica","Georgia","Verdana","Tahoma","Trebuchet MS","Impact","Comic Sans MS","Courier New"];
    const span  = document.createElement("span");
    span.style.cssText = "position:absolute;visibility:hidden;font-size:72px;";
    span.textContent   = "mmmmmmmmmmlli";
    document.body.appendChild(span);
    span.style.fontFamily = base;
    const baseW = span.offsetWidth, baseH = span.offsetHeight;
    const found = [];
    for(const f of test){
      span.style.fontFamily = `'${f}',${base}`;
      if(span.offsetWidth !== baseW || span.offsetHeight !== baseH) found.push(f);
    }
    document.body.removeChild(span);
    P.push("fonts:" + found.join("|"));
  } catch{ P.push("fonts:x"); }

  /* Audio fingerprint */
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC){
      const ac  = new AC();
      const osc = ac.createOscillator();
      const an  = ac.createAnalyser();
      const g   = ac.createGain();
      g.gain.value = 0;
      osc.type = "triangle";
      osc.frequency.value = 10000;
      osc.connect(an); an.connect(g); g.connect(ac.destination);
      osc.start(0);
      await new Promise(r => setTimeout(r, 100));
      const buf = new Float32Array(an.frequencyBinCount);
      an.getFloatFrequencyData(buf);
      osc.stop(); ac.close();
      const sum = buf.slice(0, 30).reduce((a, v) => a + Math.abs(v), 0);
      P.push("au:" + sum.toFixed(4));
    } else P.push("au:x");
  } catch{ P.push("au:x"); }

  /* Plugins count (desktop) */
  P.push("pl:" + (navigator.plugins?.length || 0));

  /* Cookie / storage flags */
  P.push("ck:" + navigator.cookieEnabled);

  /* Hash everything → SHA-256 */
  const raw = P.join("|||");
  const enc = new TextEncoder().encode(raw);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  const fp  = Array.from(new Uint8Array(buf))
                   .map(b => b.toString(16).padStart(2,"0")).join("");

  ok(2, fp.slice(0,12) + "…"); setBar(65);
  return { fp, raw: P }; // send raw signals too so backend can compare partial matches
}

/* ══════════════════════════════════════════════
   STEP 3 — Submit to backend & show result
══════════════════════════════════════════════ */
async function submit(ip, fpData){
  activate(3);
  document.getElementById("i3").textContent = "Checking…";
  setBar(80);

  const r = await post(`${BACKEND}/api/verify`, {
    uid:        UID,
    refId:      REF_ID,
    msgId:      MSG_ID,
    initData,
    ip,
    userAgent:  navigator.userAgent,
    fingerprint: fpData.fp,
    fpSignals:  fpData.raw,   // backend can do partial-match multi-account detection
    timezone:   Intl.DateTimeFormat().resolvedOptions().timeZone,
    language:   navigator.language,
    platform:   navigator.platform,
    screen:     screen.width + "x" + screen.height
  });

  if(!r.ok) throw new Error(`Server error ${r.status}`);
  return await r.json();
}

/* ══════════════════════════════════════════════
   Main
══════════════════════════════════════════════ */
(async () => {
  try{
    const ip     = await getIP();
    const fpData = await getFingerprint();
    const result = await submit(ip, fpData);

    setBar(100);

    if(result.status === "verified" || result.status === "already_verified"){
      ok(3, "Verified ✓");
      showOK();
      close(2200);

    } else if(result.status === "blocked"){
      const reason = result.reason || "unknown";
      if(reason === "vpn"){
        err(3, "Blocked — VPN");
        showErr("vpn");
      } else {
        err(3, "Blocked — duplicate device");
        showErr("multi");
      }
      close(5000);

    } else {
      throw new Error("Unexpected response from server");
    }

  } catch(e){
    err(3, "Failed — tap verify again");
    showErr(e.message?.includes("Server error") ? e.message : null);
    console.error("[verify]", e);
  }
})();
</script>
</body>
</html>
